name: Build APK Senter Multi Fungsi

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Siapkan Struktur Proyek Android
        run: |
          mkdir -p app/src/main/java/com/example/multiflashlight
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SenterMultiFungsi"
          include(":app")
          EOF

          # 2. build.gradle.kts (Root)
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.multiflashlight"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.multiflashlight"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-feature
                  android:name="android.hardware.camera.flash"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Senter Multi Fungsi"
                  android:theme="@style/Theme.MaterialComponents.DayNight.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. Ikon Aplikasi (Vector Drawable)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#1E1E1E"
                  android:pathData="M0,0h24v24h-24z" />
              <path
                  android:fillColor="#FBC02D"
                  android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z" />
          </vector>
          EOF

          # 7. Layout UI (activity_main.xml)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginBottom="24dp"
                  android:text="SENTER MULTI FUNGSI"
                  android:textColor="#FFFFFF"
                  android:textSize="20sp"
                  android:textStyle="bold" />

              <Button
                  android:id="@+id/btnPower"
                  android:layout_width="match_parent"
                  android:layout_height="64dp"
                  android:backgroundTint="#FBC02D"
                  android:text="NYALAKAN SENTER"
                  android:textColor="#121212"
                  android:textSize="16sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvBrightness"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="28dp"
                  android:text="Tingkat Kecerahan"
                  android:textColor="#CCCCCC" />

              <SeekBar
                  android:id="@+id/seekBrightness"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:text="Kecepatan Strobo (Kedip)"
                  android:textColor="#CCCCCC" />

              <SeekBar
                  android:id="@+id/seekStrobe"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:max="950"
                  android:progress="500" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="24dp"
                  android:gravity="center"
                  android:orientation="horizontal">

                  <Button
                      android:id="@+id/btnStrobe"
                      android:layout_width="0dp"
                      android:layout_height="56dp"
                      android:layout_marginEnd="8dp"
                      android:layout_weight="1"
                      android:backgroundTint="#29B6F6"
                      android:text="Mode Strobo"
                      android:textColor="#121212"
                      android:textStyle="bold" />

                  <Button
                      android:id="@+id/btnSos"
                      android:layout_width="0dp"
                      android:layout_height="56dp"
                      android:layout_marginStart="8dp"
                      android:layout_weight="1"
                      android:backgroundTint="#D32F2F"
                      android:text="Sinyal SOS"
                      android:textColor="#FFFFFF"
                      android:textStyle="bold" />
              </LinearLayout>

          </LinearLayout>
          EOF

          # 8. Class Pengendali Flash (MultiFlashlightManager.kt)
          cat << 'EOF' > app/src/main/java/com/example/multiflashlight/MultiFlashlightManager.kt
          package com.example.multiflashlight

          import android.content.Context
          import android.hardware.camera2.CameraAccessException
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.os.Build
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.isActive
          import kotlinx.coroutines.launch

          class MultiFlashlightManager(
              context: Context,
              private val scope: CoroutineScope
          ) {
              private val cameraManager = context.getSystemService(Context.CAMERA_SERVICE) as CameraManager
              private var cameraId: String? = null
              private var flashJob: Job? = null

              var maxBrightnessLevel: Int = 1
                  private set

              val hasFlashHardware: Boolean
                  get() = cameraId != null

              val isBrightnessSupported: Boolean
                  get() = Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU && maxBrightnessLevel > 1

              init {
                  findBackCameraWithFlash()
              }

              private fun findBackCameraWithFlash() {
                  try {
                      for (id in cameraManager.cameraIdList) {
                          val characteristics = cameraManager.getCameraCharacteristics(id)
                          val hasFlash = characteristics.get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                          val isBackCamera = characteristics.get(CameraCharacteristics.LENS_FACING) ==
                                  CameraCharacteristics.LENS_FACING_BACK

                          if (hasFlash && isBackCamera) {
                              cameraId = id
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  maxBrightnessLevel = characteristics.get(
                                      CameraCharacteristics.FLASH_INFO_STRENGTH_MAXIMUM_LEVEL
                                  ) ?: 1
                              }
                              break
                          }
                      }
                  } catch (e: CameraAccessException) {
                      e.printStackTrace()
                  }
              }

              fun turnOn(brightnessLevel: Int = maxBrightnessLevel) {
                  stopRunningEffects()
                  val id = cameraId ?: return
                  try {
                      if (isBrightnessSupported) {
                          val safeLevel = brightnessLevel.coerceIn(1, maxBrightnessLevel)
                          cameraManager.turnOnTorchWithStrengthLevel(id, safeLevel)
                      } else {
                          cameraManager.setTorchMode(id, true)
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun turnOff() {
                  stopRunningEffects()
                  val id = cameraId ?: return
                  try {
                      cameraManager.setTorchMode(id, false)
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              fun startStrobe(intervalMs: Long) {
                  stopRunningEffects()
                  val id = cameraId ?: return
                  val safeDelay = intervalMs.coerceAtLeast(30L)

                  flashJob = scope.launch(Dispatchers.Default) {
                      var isFlashOn = false
                      try {
                          while (isActive) {
                              isFlashOn = !isFlashOn
                              cameraManager.setTorchMode(id, isFlashOn)
                              delay(safeDelay)
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          try {
                              cameraManager.setTorchMode(id, false)
                          } catch (_: Exception) {}
                      }
                  }
              }

              fun startSOS() {
                  stopRunningEffects()
                  val id = cameraId ?: return
                  val dot = 200L
                  val dash = 600L
                  val sosPattern = listOf(dot, dot, dot, dash, dash, dash, dot, dot, dot)

                  flashJob = scope.launch(Dispatchers.Default) {
                      try {
                          while (isActive) {
                              for ((index, duration) in sosPattern.withIndex()) {
                                  if (!isActive) break
                                  cameraManager.setTorchMode(id, true)
                                  delay(duration)
                                  cameraManager.setTorchMode(id, false)

                                  val gap = if (index == 2 || index == 5) 600L else 200L
                                  delay(gap)
                              }
                              delay(1400L)
                          }
                      } catch (e: Exception) {
                          e.printStackTrace()
                      } finally {
                          try {
                              cameraManager.setTorchMode(id, false)
                          } catch (_: Exception) {}
                      }
                  }
              }

              private fun stopRunningEffects() {
                  flashJob?.cancel()
                  flashJob = null
              }
          }
          EOF

          # 9. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/multiflashlight/MainActivity.kt
          package com.example.multiflashlight

          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.widget.Button
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope

          class MainActivity : AppCompatActivity() {

              private lateinit var flashManager: MultiFlashlightManager
              private var isFlashActive = false
              private var currentMode = Mode.OFF

              private enum class Mode { OFF, NORMAL, STROBE, SOS }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  flashManager = MultiFlashlightManager(this, lifecycleScope)

                  if (!flashManager.hasFlashHardware) {
                      Toast.makeText(this, "Perangkat ini tidak memiliki lampu flash kamera", Toast.LENGTH_LONG).show()
                  }

                  val btnPower = findViewById<Button>(R.id.btnPower)
                  val btnStrobe = findViewById<Button>(R.id.btnStrobe)
                  val btnSos = findViewById<Button>(R.id.btnSos)
                  val tvBrightness = findViewById<TextView>(R.id.tvBrightness)
                  val seekBrightness = findViewById<SeekBar>(R.id.seekBrightness)
                  val seekStrobe = findViewById<SeekBar>(R.id.seekStrobe)

                  if (flashManager.isBrightnessSupported) {
                      seekBrightness.max = flashManager.maxBrightnessLevel - 1
                      seekBrightness.progress = flashManager.maxBrightnessLevel - 1
                  } else {
                      tvBrightness.visibility = View.GONE
                      seekBrightness.visibility = View.GONE
                  }

                  fun setPowerUiState(active: Boolean) {
                      isFlashActive = active
                      if (active) {
                          btnPower.text = "MATIKAN SENTER"
                          btnPower.setBackgroundColor(Color.parseColor("#E53935"))
                          btnPower.setTextColor(Color.WHITE)
                      } else {
                          btnPower.text = "NYALAKAN SENTER"
                          btnPower.setBackgroundColor(Color.parseColor("#FBC02D"))
                          btnPower.setTextColor(Color.parseColor("#121212"))
                      }
                  }

                  btnPower.setOnClickListener {
                      if (isFlashActive) {
                          flashManager.turnOff()
                          currentMode = Mode.OFF
                          setPowerUiState(false)
                      } else {
                          val level = seekBrightness.progress + 1
                          flashManager.turnOn(level)
                          currentMode = Mode.NORMAL
                          setPowerUiState(true)
                      }
                  }

                  seekBrightness.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (currentMode == Mode.NORMAL && isFlashActive) {
                              flashManager.turnOn(progress + 1)
                          }
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })

                  btnStrobe.setOnClickListener {
                      val delayMs = (1000 - seekStrobe.progress).toLong()
                      flashManager.startStrobe(delayMs)
                      currentMode = Mode.STROBE
                      setPowerUiState(true)
                  }

                  seekStrobe.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(seekBar: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (currentMode == Mode.STROBE && isFlashActive) {
                              val delayMs = (1000 - progress).toLong()
                              flashManager.startStrobe(delayMs)
                          }
                      }
                      override fun onStartTrackingTouch(seekBar: SeekBar?) {}
                      override fun onStopTrackingTouch(seekBar: SeekBar?) {}
                  })

                  btnSos.setOnClickListener {
                      flashManager.startSOS()
                      currentMode = Mode.SOS
                      setPowerUiState(true)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  flashManager.turnOff()
              }
          }
          EOF

      - name: Compile menjadi APK
        run: gradle assembleDebug

      - name: Upload File APK Siap Install
        uses: actions/upload-artifact@v4
        with:
          name: SenterMultiFungsi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
